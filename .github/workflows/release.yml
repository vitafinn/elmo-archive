name: Preview release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.2.0-preview.12'
        required: true
        default: '0.2.0-preview.12'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid version' }
          git show-ref --verify --quiet "refs/tags/v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -eq 0) { throw 'This version tag already exists. Use a new version.' }
          $global:LASTEXITCODE = 0
      - run: npm --prefix frontend ci
      - run: node scripts/release-preflight.mjs
      - run: node --test frontend/tests/*.test.mjs
      - run: npm --prefix frontend run build
        env:
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Build Windows executable
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: wails build -s -ldflags "-X ElmoBeacon/handler.Version=$env:RELEASE_VERSION" -o ElmoArchive.exe
      - name: Package binary and matching source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: |
            build/release/**/*.zip
            build/release/**/SHA256SUMS.txt
      - name: Create draft pre-release for review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Elmo Archive ${{ inputs.version }}
          draft: true
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/release/**/*.zip
            build/release/**/SHA256SUMS.txt
